ow,.prize-row,.milestone-row{border:1px solid var(--line);border-radius:10px;background:#f8faff91;padding:14px;margin:12px 0}.reward-row .grid{grid-template-columns:1.2fr 1fr 1fr}.reward-row .field{margin:0}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}.big{font-size:34px;line-height:1.3;font-variant-numeric:tabular-nums;font-weight:650;margin:14px 0}.stat small{margin-top:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:650px}.calendar button{padding:7px 3px;min-width:0;display:block}.calendar .checked{background:#e4f5ee;color:#22634c}.calendar .today{border:2px solid var(--accent)}.calendar .missed{background:#fff4dc}.calendar span{text-align:center;font-size:12px;color:var(--muted)}.calendar small{font-size:10px}.step{display:flex;gap:12px;margin:12px 0}.step b{flex:none;display:grid;place-items:center;background:var(--soft);color:var(--accent);width:28px;height:28px;border-radius:50%}.reward-amount{font-size:25px;font-weight:700;color:var(--accent)}.prizes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.prize{padding:23px 12px;text-align:center;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#f2efff,#eaf4fb)}.prize:nth-child(2){background:linear-gradient(135deg,#e8f3f0,#ebf5fb)}.prize:nth-child(3){background:linear-gradient(135deg,#fff0d5,#f9e5f0)}.empty{text-align:center;padding:35px;color:var(--muted)}dialog{width:min(700px,calc(100vw - 32px));max-height:86vh;border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--ink);background:#fff;box-shadow:0 20px 80px #16254840}dialog::backdrop{background:#1a244b66}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.dialog-head h2{margin:0}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90vw;background:#24314c;color:white;padding:12px 20px;border-radius:10px;display:none;z-index:10}.review-only{font-size:12px;padding:12px 14px;border:1px dashed #aeb9d1;border-radius:8px;color:var(--muted);margin-bottom:16px}.switch-label{display:flex;align-items:center;gap:9px;font-size:14px}.filters{display:flex;gap:12px;flex-wrap:wrap}.filters>*{flex:1;min-width:130px}.filters button{flex:0;white-space:nowrap}.rule-list li{margin:8px 0}.skip{position:absolute;top:-100px}.skip:focus{top:8px;background:white;padding:8px;z-index:100}:focus-visible{outline:3px solid #8799ed;outline-offset:3px}[hidden]{display:none!important}.coverage td{white-space:normal}.check{color:var(--success)}.next{display:flex;gap:12px;justify-content:space-between;margin-top:28px}.preview-value{white-space:pre-wrap;overflow-wrap:anywhere}.flow-links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.editor-help{font-size:12px;color:var(--muted)}

<body><a class="skip" href="#main">跳到页面内容</a><header><div><strong>☾ 银月</strong><span class="pill">营销原型 P1</span></div><div class="tools"><label>外观样例 <select id="theme"><option value="default">默认</option><option value="dream">银月梦境</option><option value="cloud">绯云</option></select></label><button id="reset">重置演示</button></div></header>
<div class="prototype-banner">静态原型 · 所有姓名、金额、日期均为演示数据 · 操作仅影响本次浏览，不连接账号、支付或数据库</div>
<div class="layout"><aside><nav id="nav" aria-label="原型页面导航"></nav></aside><main id="main" tabindex="-1"></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭弹窗">关闭</button></div><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
/* Standalone review artifact. No application imports, APIs, real credentials or storage. */
'use strict';
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = value => new Intl.NumberFormat('zh-CN', {style:'currency', currency:'CNY', minimumFractionDigits:2, maximumFractionDigits:6}).format(value);
const state = {checkin:false, makeup:false, draws:3, drawn:[], redeemed:false, disabled:false, saved:[], profileScene:'normal', lotteryScene:'normal'};
const routes = [
 ['审阅导航','overview','开始核对'],['管理员','activities','营销活动'],['管理员','registration','注册有礼'],['管理员','checkin','签到活动'],['管理员','recharge','充值活动'],['管理员','invitation','邀请活动'],['管理员','pools','抽奖管理'],['管理员','pool-edit','奖池配置'],['管理员','records','奖励记录'],['管理员','codes','付费兑换码'],['管理员','users','用户管理'],
 ['用户','wallet','钱包与充值'],['用户','gifts','赠金明细'],['用户','profile','个人资料 · 签到'],['用户','lottery','抽奖'],['用户','invite','邀请好友'],['用户','usage','使用日志'],['用户','my-rewards','我的奖励'],['审阅导航','states','状态与中英文样例'],['审阅导航','coverage','需求覆盖与待定项']
];
const names = Object.fromEntries(routes.map(r => [r[1],r[2]]));
let currentRoute = 'overview';
let uniqueId = 0;
const uid = prefix => `${prefix}-${++uniqueId}`;
const link = (route, text, primary=false) => `<a class="button${primary?' primary':''}" href="#${route}">${text}</a>`;
const note = (text, pending=false) => `<div class="note${pending?' pending':''}">${text}</div>`;
const review = text => `<div class="review-only">原型核对说明 · ${text}</div>`;
const card = (title, body) => `<section class="card"><h2>${title}</h2>${body}</section>`;
const badge = (text, type='') => `<span class="pill ${type}">${text}</span>`;
function field(label, control, help='') { return `<label class="field"><span>${label}</span>${control}${help?`<small>${help}</small>`:''}</label>`; }
function input(value='', type='text', attrs='') { return `<input type="${type}" value="${esc(value)}" ${attrs}>`; }
function num(value, attrs='') { return input(value,'number',`min="0.000001" step="any" required ${attrs}`); }
function select(options, attrs='', selected='') { return `<select ${attrs}>${options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===selected?' selected':''}>${l}</option>`;}).join('')}</select>`; }
function table(headers, rows, cls='') { return `<div class="table-wrap"><table class="${cls}"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
function title(text, sub, actions='') { return `<div class="title-row"><div><h1>${text}</h1><p class="muted">${sub}</p></div>${actions}</div>`; }
function toast(text) { $('#toast').textContent=text; $('#toast').style.display='block'; clearTimeout(toast.timer); toast.timer=setTimeout(()=>$('#toast').style.display='none',4500); }
function modal(titleText, html) { $('#dialog-title').textContent=titleText; $('#dialog-body').innerHTML=html; $('#dialog').showModal(); }
function actions() { return `<div class="actions"><a class="button" href="#activities">返回活动列表</a><button class="primary" type="submit">核对规则摘要</button></div>`; }
function rewardRow(allowRatio=false, forced='', amount='2', duration=3, unit='天') {
 return `<div class="reward-row"><div class="grid">${field('奖励内容',select([['gift','固定赠金'],...(allowRatio?[['ratio','充值比例赠金']]:[]),['chance','抽奖机会']], 'data-reward-type', forced||'gift'))}<div data-gift-amount>${field('赠金金额（元）',num(amount,'data-amount'))}</div><div data-ratio-amount hidden>${field('赠送比例（%）',num('5','data-ratio disabled'),'基数：该笔到账付费金额，不含赠金')}</div><div data-lifetime>${field('赠金类型',select([['limited','限时赠金'],['permanent','永久赠金']],'data-life'))}</div><div data-duration>${field('到账后有效时长',`<div class="row">${num(duration,'data-duration-value')}${select(['天','小时','分钟'],'data-duration-unit',unit)}</div>`)}</div><div data-chance-pool hidden>${field('指定奖池',select([['moon','月光礼盒 · 必得赠金'],['luck','幸运转盘 · 可未中奖']],'data-pool disabled'))}</div><div data-chance-count hidden>${field('赠送次数',input(1,'number','min="1" step="1" required data-count disabled'))}</div></div><div class="row"><small>赠金到账直接生效；限时赠金到期失效，永久赠金金额有限。均不可退款。</small><button type="button" data-remove-reward>移除这项</button></div></div>`;
}
function rewards(titleText='发放什么', ratio=false, initial='gift', amount=2, duration=3, unit='天') {
 return `<section class="card reward-editor" data-ratio-allowed="${ratio}"><h2>${titleText}</h2><div class="reward-list">${rewardRow(ratio,initial,amount,duration,unit)}</div><button type="button" data-add-reward>＋ 添加组合奖品</button><small>可组合多份赠金和指定奖池机会，无需预先建立额度包模板。</small></section>`;
}
function common(kind) {
 return card('活动基本信息',`<div class="grid">${field('活动名称',input({registration:'新朋友见面礼',checkin:'十一月签到礼',recharge:'充值福利',invitation:'邀请好友礼'}[kind],'text','required name="活动名称" maxlength="80"'))}${field('活动有效期',select([['range','指定起止时间'],['forever','长期有效']],'data-time name="有效期"'))}<div data-date>${field('开始时间（上海时区）',input('2026-11-01T00:00','datetime-local','required name="开始时间"'))}</div><div data-date>${field('结束时间（上海时区）',input('2026-11-30T23:59','datetime-local','required name="结束时间"'))}</div></div>${note('金额按站点设置显示，本原型示例单位为元。日期和金额仅为演示，不是上线默认值。')}`);
}
function advanced() {
 return `<details><summary>活动叠加与优先级</summary><div class="grid">${field('与其他活动的关系',select([['stack','允许叠加，各自发奖'],['exclusive','同一互斥组仅发一个活动']],'data-stack name="叠加方式"'))}<div data-exclusive hidden>${field('互斥组名称',input('充值优惠','text','name="互斥组" disabled'))}${field('优先级（数值越大越优先）',input(10,'number','step="1" name="优先级" disabled'))}</div></div><p class="editor-help">同优先级按固定活动顺序决定。已确认允许最高优先级活动预算不足时尝试可发放的较低优先级活动；预算配置方案仍待确定。用户无需选择活动。</p></details>`;
}
function overview() {
 return title('先看完整流程，再核对字段','P1 · 需求核对原型 / 2026-11-22')+review('这套导航是审阅目录，不代表正式网站要增加这么多侧栏菜单。仅演示本次变化；原系统其他设置保留。中文原型用于核对业务，正式实现仍须支持中英文等现有语言。外观切换只是配色样例。')+
 `<div class="grid">${card('管理员：配置与追溯',`<div class="step"><b>1</b><div>创建注册、签到、充值或邀请活动，直接设置奖励。</div></div><div class="step"><b>2</b><div>需要送抽奖机会时，选择独立奖池。</div></div><div class="step"><b>3</b><div>核对规则摘要，启用活动；奖励记录关联触发事实。</div></div><div class="flow-links">${link('activities','查看活动列表',true)}${link('pool-edit','配置奖池')}${link('records','查看奖励来源')}</div>`)}${card('用户：参与与消费',`<div class="step"><b>1</b><div>注册、充值或邀请达标后自动得奖；签到仍在个人资料。</div></div><div class="step"><b>2</b><div>获得的赠金直接可用；有机会时主动抽奖。</div></div><div class="step"><b>3</b><div>钱包看两类剩余金额，使用日志一条请求看费用拆分。</div></div><div class="flow-links">${link('wallet','查看钱包',true)}${link('profile','个人资料签到')}${link('usage','查看使用日志')}</div>`)}</div>`+
 card('建议按这三条路径检查',`<ol class="rule-list"><li><a href="#checkin">签到活动配置</a> → <a href="#profile">个人资料签到</a> → <a href="#gifts">赠金明细</a>：第七天每日 ¥1 ＋ 连续额外 ¥2 ＝ ¥3。</li><li><a href="#recharge">充值条件与组合奖励</a> → <a href="#lottery">抽奖</a> → <a href="#records">奖励记录</a>：先得到机会，再主动开奖。</li><li><a href="#codes">付费兑换码</a> → <a href="#wallet">兑换入账</a> → <a href="#usage">消费来源</a> → <a href="#users">人工退款时禁用账号</a>。</li></ol>`)+
 note('<strong>尚未定稿的部分有明确标记</strong>预算与机会供给、补库存与改概率的轮次、机会截止与暂停联动、累计余数修改、退款后恢复账号。原型展示这些缺口，不用旧方案代替决定。',true)+link('coverage','逐项查看覆盖清单');
}
function activities() {
 const rows=[['新朋友见面礼','注册','11/01—11/30','注册送 ¥2 / 3 天','启用','registration'],['十一月签到礼','签到','11/01—11/30','每日 ¥1，连续 7 天额外 ¥2','启用','checkin'],['充值福利','充值','11/01—11/30','累计每满实付 ¥100，得 1 次机会','暂停','recharge'],['邀请好友礼','邀请','长期','新好友注册，送 ¥2 / 3 天','启用','invitation']];
 return title('营销活动','选择场景配置，奖励自动发放。')+`<div class="flow-links">${link('registration','＋ 注册有礼')}${link('checkin','＋ 签到奖励')}${link('recharge','＋ 充值奖励')}${link('invitation','＋ 邀请奖励')}</div>`+
 card('活动列表',field('筛选活动',input('','search','data-filter placeholder="输入名称或类型"'))+table(['名称','类型','有效期','奖励摘要','状态','操作'],rows.map(r=>[r[0],r[1],r[2],r[3],`<span data-status>${badge(r[4],r[4]==='启用'?'success':'warn')}</span>`,`${link(r[5],'查看配置')} <button data-pause>${r[4]==='启用'?'暂停':'启用'}</button>`])))+
 card('本次浏览中核对过的活动',state.saved.length?table(['活动','规则摘要'],state.saved.map(r=>[esc(r.name),`<div class="preview-value">${esc(r.summary)}</div>`])):'<p class="muted">尚未核对。打开任一活动，填写后点击“核对规则摘要”。刷新会清除演示数据。</p>')+
 note('暂停后不接受该活动的新资格，暂停前已成立的奖励仍按原依据发放。编辑已发布规则如何生效、累计余数如何处理仍待明确。',true);
}
function activityEditor(kind) {

 const start=form.elements.namedItem('开始时间'),end=form.elements.namedItem('结束时间');
 if(start&&!start.disabled&&end&&!end.disabled&&start.value>=end.value){toast('结束时间必须晚于开始时间。');end.focus();return false;}
 for(const editor of $$('.reward-editor',form).filter(e=>!e.closest('[hidden]'))){if(!$('.reward-row',editor)){toast('每个已启用的奖励区至少配置一项奖励。');editor.scrollIntoView({block:'center'});return false;}}
 const days=$$('[data-milestone-day]',form).filter(x=>!x.disabled).map(x=>Number(x.value));
 if(new Set(days).size!==days.length){toast('连续奖励的天数档位不能重复。');return false;}
 if($('[data-streak]',form)?.value!=='off'&&$('[data-streak]',form)&&!days.length){toast('启用连续奖励后，至少配置一个天数档位。');return false;}
 if($('[data-streak]',form)?.value==='cycle'&&days.some(n=>n>Number(form.elements.namedItem('循环天数').value))){toast('连续奖励档位不能超过循环周期。');return false;}
 return true;
}
function render() {
 currentRoute=location.hash.slice(1)||'overview';if(!names[currentRoute])currentRoute='overview';
 if($('#dialog').open)$('#dialog').close();
 let group='';$('#nav').innerHTML=routes.map(r=>{let s='';if(group!==r[0]){s=`<h3>${r[0]}</h3>`;group=r[0];}return s+`<a href="#${r[1]}" class="${r[1]===currentRoute?'active':''}" ${r[1]===currentRoute?'aria-current="page"':''}>${r[2]}</a>`;}).join('');
 const page={overview,activities,registration:()=>activityEditor('registration'),checkin:()=>activityEditor('checkin'),recharge:()=>activityEditor('recharge'),invitation:()=>activityEditor('invitation'),pools,'pool-edit':poolEditor,records:()=>records(false),codes,users,wallet,gifts,profile,lottery,invite,usage,'my-rewards':()=>records(true),states:statesPage,coverage};
 $('#main').innerHTML=page[currentRoute]();
 const i=routes.findIndex(r=>r[1]===currentRoute);
 $('#main').insertAdjacentHTML('beforeend',`<div class="next">${i>0?link(routes[i-1][1],`← ${routes[i-1][2]}`):'<span></span>'}${i<routes.length-1?link(routes[i+1][1],`${routes[i+1][2]} →`):link('overview','返回开始')}</div>`);
 $$('.reward-row').forEach(syncReward);
 const recharge=$('[data-recharge-condition]');if(recharge)syncEditor(recharge);
 document.title=`${names[currentRoute]} · 银月营销原型 P1`;
 window.scrollTo(0,0);$('#main').focus({preventScroll:true});
}
document.addEventListener('change',event=>{
 const target=event.target;
 syncEditor(target);
 if(target.id==='theme')document.body.dataset.theme=target.value;
 if(target.id==='profile-scene'){state.profileScene=target.value;render();}
 if(target.id==='lottery-scene'){state.lotteryScene=target.value;render();}
 if(target.id==='log-type')$$('[data-log-kind]').forEach(el=>el.hidden=target.value!=='全部'&&el.dataset.logKind!==target.value);
});
document.addEventListener('input',event=>{
 if(!event.target.matches('[data-filter]'))return;
 const term=event.target.value.toLowerCase();const container=event.target.closest('.card');$$('tbody tr',container).forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(term));
});
document.addEventListener('submit',event=>{
 event.preventDefault();const form=event.target;if(!form.reportValidity()||!validateCustom(form))return;
 if(form.id==='activity-form'){
  const summary=activitySummary(form);const name=form.elements.namedItem('活动名称').value;
  modal('核对活动规则',`<div class="preview-value">${esc(summary)}</div>${note('以下只保存为本次浏览的演示配置，不创建真实活动。')}<div class="actions"><button id="save-demo" class="primary">保存演示</button></div>`);
  $('#save-demo').onclick=()=>{state.saved.push({name,summary});$('#dialog').close();location.hash='activities';toast('已保存本次浏览的演示配置；刷新后清除。');};
 }
 if(form.id==='pool-form'){
  const prizes=$$('.prize-row',form);if(!prizes.length){toast('请至少配置一个真实奖项。');return;}
  const rows=prizes.map(p=>[esc($('[data-prize-name]',p).value),esc($('[data-weight]',p).value),$('[data-stock]',p).value==='limited'?`${esc($('[data-stock-value]',p).value)} 份`:'不限数量',$$('.reward-row',p).map(r=>esc(rewardSummary(r))).join('<br>')]);
  const empty=$('[data-empty-prize]').value==='yes';
  modal('奖池规则摘要',`<p>${esc(form.elements.namedItem('奖池名称').value)}</p><p>开放时间：${esc(form.elements.namedItem('开始时间').value)} — ${esc(form.elements.namedItem('结束时间').value)}</p>${table(['奖项','权重','库存','赠金'],rows)}${note(empty?`允许未中奖；谢谢惠顾权重 ${esc(form.elements.namedItem('未中奖权重').value)}。未中奖消耗机会，不发赠金。`:'成功开奖必得赠金，可用于确定或概率获得机会的对应玩法。')}${note('库存供给、轮次与截止政策待确认，本原型不模拟真实发布。',true)}`);
 }
 if(form.id==='code-form')modal('付费兑换码登记摘要',table(['字段','内容'],[...new FormData(form)].map(([k,v])=>[esc(k),esc(v)]))+note('兑换到账属于付费金额。营销奖励独立发放。此处没有生成真实兑换码。'));
 if(form.id==='redeem-form'){
  if(form.elements.namedItem('code').value!=='DEMO-PAID-100'){toast('演示码不存在，请使用预填的 DEMO-PAID-100。');return;}
  if(state.redeemed){toast('此演示码已经兑换。');return;}state.redeemed=true;render();modal('兑换成功 · 演示',`<p>到账付费金额 <strong>¥100.00</strong></p><p>记录实际支付：人民币 ¥100.00。</p>${note('真实实现中会按本站成功入账时间判断注册以外的适用充值、签到资格、邀请和抽奖活动；不保证每次兑换必有奖励。')}${link('my-rewards','查看奖励记录')}`);
 }
});
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.id==='close-dialog')$('#dialog').close();
 if(button.id==='reset'){location.reload();return;}
 if(button.matches('[data-add-reward],[data-add-prize-gift]')){
  const editor=button.closest('.reward-editor');const rowHtml=rewardRow(editor.dataset.ratioAllowed==='true');$('.reward-list',editor).insertAdjacentHTML('beforeend',rowHtml);syncReward($('.reward-list',editor).lastElementChild);
 }
 if(button.matches('[data-remove-reward]'))button.closest('.reward-row').remove();
 if(button.matches('[data-add-milestone]')){const list=$('#milestones');list.insertAdjacentHTML('beforeend',milestone());$$('.reward-row',list.lastElementChild).forEach(syncReward);}
 if(button.matches('[data-remove-milestone]'))button.closest('.milestone-row').remove();
 if(button.matches('[data-add-prize]')){$('#prizes').insertAdjacentHTML('beforeend',prizeRow('新奖项',2,10,'limited'));$$('.reward-row',$('#prizes').lastElementChild).forEach(syncReward);}
 if(button.matches('[data-remove-prize]'))button.closest('.prize-row').remove();
 if(button.matches('[data-pause]')){const active=button.textContent==='暂停';button.textContent=active?'启用':'暂停';$('[data-status]',button.closest('tr')).innerHTML=badge(active?'暂停':'启用',active?'warn':'success');toast('演示状态已更新；未修改真实活动。');}
 if(button.matches('[data-reward-detail]'))rewardDetail(button.dataset.rewardDetail);
 if(button.matches('[data-gift]'))giftDetail(Number(button.dataset.gift));
 if(button.matches('[data-usage-detail]'))usageDetail();
 if(button.matches('[data-checkin]')){
  state.checkin=true;render();modal('签到成功 · 演示',`<p>每日奖励 ¥1.00 ＋ 连续第 7 天额外奖励 ¥2.00</p><div class="big">合计 ¥3.00</div><p>赠金自动到账，无需领取。</p>${state.profileScene==='multi'?note('周末签到礼另赠 ¥0.50；本场景允许叠加，本次总计 ¥3.50。'):''}${link('gifts','查看赠金明细')}`);
 }
 if(button.matches('[data-day]'))modal('补签 11 月 14 日',`<p>符合漏签当天资格；在最近 10 天范围内。</p><p>十一月签到礼：本活动剩余 1 次，补签后剩余 0 次。</p><p>本活动已配置补发每日奖励：赠金 ¥1.00 / 3 天。</p>${state.profileScene==='multi'?'<p>周末签到礼：本活动剩余 2 次，补签后剩余 1 次；补发每日赠金 ¥0.50。</p>':''}${note('同时修复连续记录，已经发过的连续档位不再发。由系统判断全部适用活动。')}<div class="actions"><button id="confirm-makeup" class="primary">确认补签（演示）</button></div>`);
 if(button.id==='confirm-makeup'){state.makeup=true;$('#dialog').close();render();toast('已补签演示日期，每个适用活动分别扣除本活动次数。');}
 if(button.matches('[data-draw]')){
  if(state.lotteryScene==='error'){modal('抽奖暂未完成',note('本场景模拟提交前网络失败：机会尚未扣除，请稍后重试。若服务器已形成结果，则恢复原结果，不能重新开奖。'));return;}
  const empty=state.lotteryScene==='empty';state.draws--;const r={pool:empty?'幸运转盘':'月光礼盒',result:empty?'未中奖':'月光赠金',gift:empty?'无赠金到账':'¥2.00 / 2 小时'};state.drawn.unshift(r);render();modal(empty?'谢谢惠顾':'恭喜中奖',`<div class="big">${empty?'本次未中奖':'¥2.00 限时赠金'}</div><p>${empty?'已使用 1 次机会，不产生赠金到账。':'已使用 1 次机会，赠金自动到账，有效期 2 小时。'}</p><p>剩余 ${state.draws} 次机会。</p>${empty?'':link('gifts','查看赠金明细')}`);
 }
 if(button.matches('[data-disable-user]'))modal('禁用演示用户',`<p>禁用后，此用户所有 SK 的新调用将被拒绝。</p>${note('不会执行现金退款或清空余额；不保证立即中断已开始请求。真实禁用须由后台权限控制。')}<div class="actions"><button class="danger" id="confirm-disable">确认禁用（仅演示）</button></div>`);
 if(button.id==='confirm-disable'){state.disabled=true;$('#dialog').close();render();toast('已切换演示账号状态，没有修改任何真实账号。');}
 if(button.matches('[data-online-pay]')){
  const amount=$('#demo-topup');if(!amount.reportValidity())return;
  modal('充值结果示例',`<p>实际支付：人民币 ${esc(money(Number(amount.value)))}</p><p>到账付费金额按站点充值配置确定；活动赠金另行记录。</p>${note('本原型不发起支付、不假定实付与到账永远相等。支付成功入账后系统自动判断活动，用户无需再点击领取。')}`);
 }
 if(button.matches('[data-demo-retry]'))toast('这是加载失败状态样例；没有连接真实接口。');
 if($('[data-lottery-mode]'))syncEditor($('[data-lottery-mode]'));
});
window.addEventListener('hashchange',render);
render();

</script></body></html>
