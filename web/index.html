<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <!-- Silvermoon site branding; upstream New API attribution is retained in the application. -->
    <title>银月</title>
    <meta name="title" content="银月" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Keep the package key/allowlist in sync with theme-storage/customization.
         Apply before React and before body content to prevent a theme flash. -->
    <script>
      ;(function () {
        var theme = 'default'
        try {
          if (
            localStorage.getItem('silvermoon:theme:v1:package') ===
            'silvermoon-dream'
          )
            theme = 'silvermoon-dream'
        } catch (e) {}
        document.documentElement.classList.remove('dark')
        document.documentElement.classList.add('light')
        document.documentElement.dataset.themePackage = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            'content',
            theme === 'silvermoon-dream' ? '#f1ecf8' : '#eeedf6'
          )
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <script>
      if (
        document.documentElement.dataset.themePackage === 'silvermoon-dream'
      ) {
        document.body.dataset.themePreset = 'silvermoon-dream'
      }
      document.body.dataset.themeFont = 'system'
    </script>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
